plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.GramStream'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.GramStream"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"

        // Configures packaging for 32-bit ARM TV boxes alongside 64-bit devices
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

    // Local embedded HTTP server -> serves the GramStream addon endpoints
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // QR Code generation
    implementation 'com.google.zxing:core:3.5.3'
}